<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ovation · Prototype Gallery</title>
<style>
  :root{
    --bg:#0a0a0b; --panel:#131315; --ink:#f5f2ec; --dim:#8e8b84; --faint:#5a5751;
    --line:rgba(245,242,236,.10); --accent:#c9a227;
    --serif:ui-serif,Georgia,'Iowan Old Style','Times New Roman',serif;
    --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
    --sans:ui-sans-serif,-apple-system,'Segoe UI',Inter,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}

  /* ================= top bar ================= */
  .bar{height:58px;display:flex;align-items:center;gap:18px;padding:0 20px;
    border-bottom:1px solid var(--line);background:rgba(10,10,11,.9);backdrop-filter:blur(10px);
    position:relative;z-index:20}
  .brand{font:500 11px/1 var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--faint);white-space:nowrap}
  .brand b{color:var(--ink);font-weight:500}
  .crumb{font:400 19px/1 var(--serif);letter-spacing:-.01em;white-space:nowrap}
  .spacer{flex:1}

  .seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .seg button{background:transparent;border:0;color:var(--dim);padding:8px 14px;cursor:pointer;
    font:500 10px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;white-space:nowrap}
  .seg button:hover{color:var(--ink)}
  .seg button.on{background:var(--ink);color:#0a0a0b}

  .ghost{background:transparent;border:1px solid var(--line);color:var(--dim);border-radius:8px;
    padding:8px 13px;cursor:pointer;font:500 10px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase}
  .ghost:hover{color:var(--ink);border-color:rgba(245,242,236,.28)}

  select{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;
    padding:8px 11px;font:500 11px/1 var(--mono);cursor:pointer}

  .stage{height:calc(100% - 58px);overflow:auto;position:relative}

  /* ================= grid view ================= */
  .intro{padding:34px 30px 8px;max-width:1500px;margin:0 auto}
  .intro h1{font:400 34px/1.1 var(--serif);letter-spacing:-.025em}
  .intro p{color:var(--dim);font-size:14px;line-height:1.6;margin-top:11px;max-width:64ch}
  .intro kbd{font:500 10px/1 var(--mono);background:var(--panel);border:1px solid var(--line);
    border-radius:4px;padding:3px 6px;color:var(--ink)}

  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(430px,1fr));gap:22px;
    padding:26px 30px 60px;max-width:1500px;margin:0 auto}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;
    cursor:pointer;transition:border-color .2s,transform .2s;display:flex;flex-direction:column}
  .card:hover{border-color:rgba(245,242,236,.3);transform:translateY(-3px)}

  .thumb{position:relative;height:310px;overflow:hidden;background:#000;border-bottom:1px solid var(--line)}
  .thumb iframe{position:absolute;top:0;left:0;width:1440px;height:1080px;border:0;
    transform:scale(.335);transform-origin:0 0;pointer-events:none}
  .thumb .veil{position:absolute;inset:0;background:linear-gradient(transparent 62%,rgba(19,19,21,.85));
    display:flex;align-items:flex-end;justify-content:flex-end;padding:13px;opacity:0;transition:opacity .2s}
  .card:hover .thumb .veil{opacity:1}
  .thumb .veil span{font:500 10px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;
    background:var(--ink);color:#0a0a0b;padding:8px 12px;border-radius:6px}

  .body{padding:20px 22px 22px;flex:1;display:flex;flex-direction:column}
  .key{font:500 10px/1 var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--accent)}
  .title{font:400 25px/1.15 var(--serif);letter-spacing:-.02em;margin:11px 0 0}
  .q{font:400 13.5px/1.55 var(--sans);color:var(--dim);margin-top:12px;flex:1}
  .q em{color:var(--ink);font-style:italic}
  .tags{display:flex;gap:7px;margin-top:16px;flex-wrap:wrap}
  .tag{font:500 9px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;
    border:1px solid var(--line);color:var(--faint);padding:5px 8px;border-radius:4px}

  /* ================= full + compare ================= */
  .full{position:absolute;inset:0;display:none}
  .full iframe{width:100%;height:100%;border:0;background:#0a0a0b}
  .cmp{position:absolute;inset:0;display:none;grid-template-columns:1fr 1fr}
  .cmp .pane{position:relative;border-right:1px solid var(--line);display:flex;flex-direction:column}
  .cmp .pane:last-child{border-right:0}
  .cmp .phead{height:42px;display:flex;align-items:center;gap:10px;padding:0 14px;
    border-bottom:1px solid var(--line);background:var(--panel);flex-shrink:0}
  .cmp .phead .k{font:500 10px/1 var(--mono);letter-spacing:.16em;color:var(--accent)}
  .cmp iframe{flex:1;width:100%;border:0;background:#0a0a0b}

  body.view-full .stage{overflow:hidden}
  body.view-full .full{display:block}
  body.view-cmp .stage{overflow:hidden}
  body.view-cmp .cmp{display:grid}
  body.view-full .gridview,body.view-cmp .gridview{display:none}
  .only-grid{display:flex}
  body.view-full .only-grid,body.view-cmp .only-grid{display:none}
  .only-full{display:none}
  body.view-full .only-full{display:flex}
  .only-cmp{display:none}
  body.view-cmp .only-cmp{display:flex}
</style>
</head>
<body class="view-grid">

<div class="bar">
  <span class="brand"><b>Ovation</b> &nbsp;prototypes</span>

  <button class="ghost only-full" onclick="showGrid()">← All</button>
  <button class="ghost only-cmp" onclick="showGrid()">← All</button>
  <span class="crumb only-full" id="crumb"></span>

  <div class="only-cmp" style="gap:10px;align-items:center">
    <select id="selL" onchange="syncCmp()"></select>
    <span style="color:var(--faint);font:500 10px/1 var(--mono)">VS</span>
    <select id="selR" onchange="syncCmp()"></select>
  </div>

  <span class="spacer"></span>

  <div class="seg only-full">
    <button onclick="step(-1)">‹ Prev</button>
    <button onclick="step(1)">Next ›</button>
  </div>

  <div class="seg only-grid">
    <button class="on">Gallery</button>
    <button onclick="showCmp()">Compare 2</button>
  </div>
</div>

<div class="stage">
  <div class="gridview">
    <div class="intro">
      <h1>The collection screen, four ways</h1>
      <p>Same seed data, same coin rendering, genuinely different structure and interaction model. Every mock has a <b>Loaded / Empty</b> toggle bottom-right, and coins flip when you click them. Click a card to open it full, or use <kbd>1</kbd>–<kbd>4</kbd>. <kbd>Esc</kbd> comes back here.</p>
    </div>
    <div class="cards" id="cards"></div>
  </div>

  <div class="full"><iframe id="fullFrame" title="prototype"></iframe></div>

  <div class="cmp">
    <div class="pane"><iframe id="cmpL" title="left"></iframe></div>
    <div class="pane"><iframe id="cmpR" title="right"></iframe></div>
  </div>
</div>

<script>
const PROTOS = [
  { key:'▶', file:'flow-buy-v3.html', title:'Buyer Flow v3 · Bone',
    q:'<em>Current.</em> Coin is one line on the seller page, listed free at checkout, then revealed on top of Kettle\'s own confirmation. Accept and the collection opens as a sheet; ignore it and nothing happens. Aligned grid, search, right-click to hide.',
    tags:['reveal not prompt','collection as sheet','aligned + search','right-click privacy'] },
  { key:'✕', file:'flow-buy-v2.html', title:'Buyer Flow v2 · Sanity (rejected)',
    q:'<em>Kept for the record.</em> The Sanity light system — white canvas, Instrument Sans, coral accent. Rejected on look. The modal architecture it introduced survived into v3.',
    tags:['rejected','sanity tokens','modals introduced here'] },
  { key:'▷', file:'flow-buy.html',  title:'Buyer Flow v1 (Bone, pages)',
    q:'<em>The story, end to end.</em> Seller page → Stripe checkout → the coin arrives and you choose public or private → your collection → coin detail and share → click a stranger and land in their collection. Six screens, clickable, keys <b>1</b>–<b>6</b>.',
    tags:['6 screens','the demo spine','consent beat','discovery loop'] },
  { key:'⚙', file:'flow-sell-v3.html', title:'Seller Flow v3 · Current',
    q:'<em>Onboarding through monetization.</em> Auth0 → Organization → <b>Connect Stripe</b> (plans sync in live) → empty dashboard → attach a coin → preview what the subscriber sees → retire a run → team + RBAC → <b>Ovation\'s own pricing</b>, which is how it gets monetized. Day one / Six weeks toggle in the rail.',
    tags:['Stripe Connect','empty → first coin','retire a run','Ovation billing'] },
  { key:'⚙', file:'flow-sell-v2.html', title:'Seller Flow v2 (superseded)',
    q:'<em>Kept for the record.</em> Introduced the plans-first dashboard, but had no Connect step, no empty state, and no monetization.',
    tags:['superseded','plans-first dashboard'] },
  { key:'⚙', file:'flow-sell.html', title:'Seller Flow v1 (superseded)',
    q:'<em>Kept for the record.</em> Coin-run-first, before plans became the organizing idea. Still has the Projects CLI screen and the two-identity-populations diagram worth keeping.',
    tags:['superseded','Projects CLI screen','identity diagram'] },
  { key:'★', file:'skins.html',    title:'D · Four Skins',
    q:'<em>Structure is locked. Which visual language?</em> D\'s exact layout and data, four different skins you can flip between live. Use the pills at the top of the page, or keys <b>1</b>–<b>4</b> once it\'s open. The coin material is the biggest lever in each.',
    tags:['live switcher','bone','studio','velvet','press'] },
  { key:'A', file:'a-case.html',   title:'The Case',
    q:'<em>Does maximum object density and physicality make this feel valuable?</em> Coins sit in recessed wells on a felt tray, sorted by date. Most literal "collection" — the wells are what make it read as a display case rather than a settings page.',
    tags:['dense grid','recessed wells','sorted by date','best when full'] },
  { key:'B', file:'b-ledger.html', title:'The Ledger',
    q:'<em>Does the receipt framing actually want a list instead of a grid?</em> Chronological rows, small coins, monospace serial column, grouped by year. The only mock where each company\'s story gets room to breathe.',
    tags:['scan not browse','story per row','leans receipt','risks bank statement'] },
  { key:'C', file:'c-stacks.html', title:'The Stacks',
    q:'<em>Does grouping by seller beat a flat grid, now that one-per-run means repeats exist?</em> Repeat runs physically stack. Click to fan a stack out, click a coin to flip it.',
    tags:['grouped by seller','loyalty is visible','fan interaction','fewer sellers per screen'] },
  { key:'D', file:'d-wall.html',   title:'The Wall',
    q:'<em>Is fewer-and-bigger more desirable than dense-and-many?</em> Most recent coin at 230px with its story, everything else smaller and asymmetric below. The only one that solves cold start — one coin still looks intentional.',
    tags:['hero coin','editorial','solves cold start','matches the reveal'] },
];

let idx = 0;

document.getElementById('cards').innerHTML = PROTOS.map((p,i)=>`
  <div class="card" onclick="showFull(${i})">
    <div class="thumb">
      <iframe src="${p.file}" scrolling="no" tabindex="-1" title="${p.title} preview"></iframe>
      <div class="veil"><span>Open full →</span></div>
    </div>
    <div class="body">
      <div class="key">${p.key}</div>
      <div class="title">${p.title}</div>
      <div class="q">${p.q}</div>
      <div class="tags">${p.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div>
    </div>
  </div>`).join('');

['selL','selR'].forEach((id,n)=>{
  document.getElementById(id).innerHTML = PROTOS.map((p,i)=>
    `<option value="${i}" ${i===n?'selected':''}>${p.key} · ${p.title}</option>`).join('');
});

function setView(v){ document.body.className = 'view-'+v; }

function showGrid(){ setView('grid'); document.getElementById('fullFrame').src='about:blank'; }

function showFull(i){
  idx = (i+PROTOS.length)%PROTOS.length;
  const p = PROTOS[idx];
  document.getElementById('fullFrame').src = p.file;
  document.getElementById('crumb').textContent = p.key + ' · ' + p.title;
  setView('full');
}

function step(d){ showFull(idx+d); }

function showCmp(){ setView('cmp'); syncCmp(); }

function syncCmp(){
  const l = PROTOS[+document.getElementById('selL').value];
  const r = PROTOS[+document.getElementById('selR').value];
  const L = document.getElementById('cmpL'), R = document.getElementById('cmpR');
  if(!L.src.endsWith(l.file)) L.src = l.file;
  if(!R.src.endsWith(r.file)) R.src = r.file;
}

addEventListener('keydown', e=>{
  if(e.key==='Escape') showGrid();
  if(e.key==='c'||e.key==='C') showCmp();
  const n = parseInt(e.key,10);
  if(n>=1 && n<=PROTOS.length) showFull(n-1);
  if(document.body.classList.contains('view-full')){
    if(e.key==='ArrowLeft') step(-1);
    if(e.key==='ArrowRight') step(1);
  }
});
</script>
</body>
</html>
